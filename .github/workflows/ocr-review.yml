name: Advisory OCR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Advisory OCR Review
    if: ${{ !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_PREFIX: ${{ runner.temp }}/kirari-ocr
    steps:
      - name: Preserve the OCR executable path across composite action steps
        shell: bash
        run: printf '%s\n' "$NPM_CONFIG_PREFIX/bin" >> "$GITHUB_PATH"
      - uses: alibaba/open-code-review@a758d9cbfb689937c7857ad64b2dd66adb58c0c2
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: 'false'
          llm_protocol: openai
          llm_extra_body: '{"thinking":{"type":"enabled"}}'
          llm_reasoning_effort: low
          ocr_version: '1.12.11'
          language: Chinese
          effort: high
          review_concurrency: '4'
          review_task_timeout: '20'
          llm_timeout: '300'
          stream_progress: 'true'
          upload_artifacts: 'true'
          sticky_summary: 'true'
          incremental: 'true'
          route_severity_below: low
          route_categories: style,documentation
          resolve_outdated: report
          checkpoint_range: 'false'
