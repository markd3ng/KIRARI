name: C1 Read-only Readiness

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: kirari-c1-readiness
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'markd3ng/KIRARI' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == 1 && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: kirari-site-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - name: Verify approved C1 with bounded read-only provider requests
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ''
          NODE_PATH: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_PRODUCTION_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}
        run: >-
          "${{ runner.tool_cache }}/node/22.12.0/x64/bin/node" scripts/p4-production/credential-gate.mjs > "$RUNNER_TEMP/c1-readiness.json"

      - name: Retain sanitized readiness result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kirari-c1-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c1-readiness.json
          if-no-files-found: error
          retention-days: 7
