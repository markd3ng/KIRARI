name: R3 authorization revocation

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types: [edited, closed, reopened, deleted]
  issue_comment:
    types: [created, edited, deleted]

# Sharing the group serializes this revoke-only mitigation with publication.
concurrency:
  group: r3-trusted-authorization
  cancel-in-progress: false

permissions: {}

jobs:
  validate-source:
    if: vars.KIRARI_R3_PUBLISHER_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.repository == 'markd3ng/KIRARI'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      revocation_eligible: ${{ steps.preflight.outputs.revocation_eligible }}
    env:
      R3_PUBLISHER_ENABLED: ${{ vars.KIRARI_R3_PUBLISHER_ENABLED }}
    steps:
      - name: Check out the immutable main workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          check-latest: false
      - name: Authenticate current main source before the Environment gate
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/root-audit/revalidation-cli.mjs preflight

  revoke:
    needs: validate-source
    if: vars.KIRARI_R3_PUBLISHER_ENABLED == 'true' && needs.validate-source.outputs.revocation_eligible == 'true' && github.ref == 'refs/heads/main' && github.repository == 'markd3ng/KIRARI'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: r3-trusted-publisher
    permissions:
      contents: read
      pull-requests: read
    env:
      R3_PUBLISHER_ENABLED: ${{ vars.KIRARI_R3_PUBLISHER_ENABLED }}
    steps:
      - name: Check out the immutable main workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          check-latest: false
      - name: Reauthenticate current main source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/root-audit/revalidation-cli.mjs preflight
      - name: Mint a repository-scoped check-writer token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.KIRARI_R3_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.KIRARI_R3_PUBLISHER_PRIVATE_KEY }}
          owner: markd3ng
          repositories: KIRARI
          permission-checks: write
          skip-token-revoke: false
      - name: Retire cached dedicated-App successes and read them back
        env:
          GH_TOKEN: ${{ github.token }}
          R3_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          R3_PUBLISHER_APP_ID: ${{ vars.KIRARI_R3_PUBLISHER_APP_ID }}
        run: node scripts/root-audit/revalidation-cli.mjs revoke
