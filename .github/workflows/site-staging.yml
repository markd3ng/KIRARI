name: P3 Site Preview Staging

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful CI workflow_dispatch run on main that produced the Site package
        required: true
        type: string
      site_package_artifact_id:
        description: Exact GitHub artifact ID of kirari-site-package
        required: true
        type: string
      site_package_archive_digest:
        description: Exact GitHub artifact SHA-256 digest (sha256:...)
        required: true
        type: string
      owner_authorization:
        description: Type the exact approval phrase for this one Preview deployment
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: kirari-p3-site-staging
  cancel-in-progress: false

jobs:
  deploy-and-validate:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: Preview – kirari-test
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      PACKAGE_ARTIFACT_ID: ${{ inputs.site_package_artifact_id }}
      PACKAGE_ARCHIVE_DIGEST: ${{ inputs.site_package_archive_digest }}
      OWNER_AUTHORIZATION: ${{ inputs.owner_authorization }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: 9.14.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - name: Install workflow source dependencies
        run: pnpm install --frozen-lockfile --filter kirari

      - name: Check explicit one-time authorization
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo 'Staging workflow must run from main' >&2; exit 1; }
          [[ "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]] || { echo 'Only the repository owner may authorize a staging deployment' >&2; exit 1; }
          [[ "$GITHUB_TRIGGERING_ACTOR" == "$GITHUB_REPOSITORY_OWNER" && "$GITHUB_RUN_ATTEMPT" == '1' ]] || { echo 'Staging authorization cannot be replayed by a rerun' >&2; exit 1; }
          [[ "$OWNER_AUTHORIZATION" == 'APPROVE KIRARI PREVIEW DEPLOYMENT TO kirari-test' ]] || { echo 'The required target-specific owner authorization phrase is missing' >&2; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ && "$PACKAGE_ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo 'Run and artifact IDs must be numeric' >&2; exit 1; }
          [[ "$PACKAGE_ARCHIVE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Artifact digest must be a SHA-256 digest' >&2; exit 1; }

      - name: Verify trusted successful source CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          jq -e '
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .status == "completed" and
            .conclusion == "success" and
            .path == ".github/workflows/ci.yml"
          ' "$RUNNER_TEMP/source-run.json" > /dev/null
          source_run_sha="$(jq -r .head_sha "$RUNNER_TEMP/source-run.json")"
          [[ "$source_run_sha" =~ ^[a-f0-9]{40}$ ]] || { echo 'Source CI run head SHA is invalid' >&2; exit 1; }
          [[ "$source_run_sha" == "$GITHUB_SHA" ]] || { echo 'Source CI run must use the same main commit as this staging workflow' >&2; exit 1; }
          echo "source_run_sha=$source_run_sha" >> "$GITHUB_OUTPUT"
        id: source_run

      - name: Verify and download exact immutable Site package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          attempt="$(jq -r .run_attempt "$RUNNER_TEMP/source-run.json")"
          expected_name="kirari-site-package-${SOURCE_RUN_ID}-${attempt}"
          jq -n \
            --arg run_id "$SOURCE_RUN_ID" \
            --arg run_attempt "$attempt" \
            --arg head_sha "$(jq -r .head_sha "$RUNNER_TEMP/source-run.json")" \
            --arg ref 'refs/heads/main' \
            --arg event "$(jq -r .event "$RUNNER_TEMP/source-run.json")" \
            --arg conclusion "$(jq -r .conclusion "$RUNNER_TEMP/source-run.json")" \
            --arg workflow_path "$(jq -r .path "$RUNNER_TEMP/source-run.json")" \
            --arg package_id "$PACKAGE_ARTIFACT_ID" \
            --arg package_name "$expected_name" \
            --arg package_digest "$PACKAGE_ARCHIVE_DIGEST" \
            '{schema_version:1,source:{run_id:$run_id,run_attempt:$run_attempt,head_sha:$head_sha,ref:$ref,event:$event,conclusion:$conclusion,workflow_path:$workflow_path},package:{id:$package_id,name:$package_name,digest:$package_digest}}' \
            > "$RUNNER_TEMP/site-artifact-expected.json"
          node scripts/site-artifact.mjs verify \
            --expected-json "$RUNNER_TEMP/site-artifact-expected.json" \
            --output-dir "$RUNNER_TEMP/site-package" \
            > "$RUNNER_TEMP/site-package-verification.json"
          jq -e \
            --arg id "$PACKAGE_ARTIFACT_ID" \
            --arg digest "$PACKAGE_ARCHIVE_DIGEST" \
            --arg run "$SOURCE_RUN_ID" \
            --arg attempt "$attempt" \
            '.result == "PASS" and .packageArtifact.id == $id and .packageArchiveSha256 == $digest and .upstream.run_id == $run and .upstream.run_attempt == $attempt' \
            "$RUNNER_TEMP/site-package-verification.json" > /dev/null
        id: package

      - name: Install and audit browser validator
        run: |
          set -euo pipefail
          npm ci --prefix scripts/p3-browser
          npm audit --prefix scripts/p3-browser --audit-level moderate
          npx --prefix scripts/p3-browser playwright install --with-deps chromium

      - name: Verify exact nonproduction Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]] || { echo 'Preview environment is missing Vercel token, team ID, or project ID' >&2; exit 1; }
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --data-urlencode "teamId=$VERCEL_ORG_ID" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
            --output "$RUNNER_TEMP/vercel-project.json"
          jq -e --arg id "$VERCEL_PROJECT_ID" --arg org "$VERCEL_ORG_ID" '
            .id == $id and .name == "kirari-test" and .accountId == $org
          ' "$RUNNER_TEMP/vercel-project.json" > /dev/null

      - name: Deploy exact prebuilt artifact to Preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/deploy-vercel-preview.mjs" \
            --site-package "$RUNNER_TEMP/site-package" \
            > "$RUNNER_TEMP/deployment-url.txt"
          node --input-type=module - "$RUNNER_TEMP/deployment-url.txt" "$GITHUB_OUTPUT" <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const value = readFileSync(process.argv[2], "utf8").trim();
          const url = new URL(value.startsWith("http") ? value : `https://${value}`);
          if (url.protocol !== "https:" || !url.hostname.startsWith("kirari-test-") || !url.hostname.endsWith(".vercel.app") || url.username || url.password || url.port || url.pathname !== "/" || url.search || url.hash) {
            throw new Error(`Unexpected Preview deployment URL: ${value}`);
          }
          appendFileSync(process.argv[3], `url=${url.origin}\nhost=${url.hostname}\n`);
          NODE
          echo "deployment_url=$(cat "$RUNNER_TEMP/deployment-url.txt")" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployment identity and Preview target
        id: deployment_identity
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          DEPLOYMENT_HOST: ${{ steps.deploy.outputs.host }}
        run: |
          set -euo pipefail
          verified=false
          for attempt in {1..10}; do
            if curl --fail --silent --show-error --get \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --data-urlencode "teamId=$VERCEL_ORG_ID" \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_HOST" \
              --output "$RUNNER_TEMP/deployment.json" && \
              jq -e --arg host "$DEPLOYMENT_HOST" --arg project "$VERCEL_PROJECT_ID" '
                (.id | startswith("dpl_")) and
                .url == $host and
                .projectId == $project and
                .readyState == "READY" and
                .target == null
              ' "$RUNNER_TEMP/deployment.json" > /dev/null; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]] || { echo 'Deployment identity did not reach READY in the configured Preview project' >&2; exit 1; }
          echo "deployment_id=$(jq -r .id "$RUNNER_TEMP/deployment.json")" >> "$GITHUB_OUTPUT"
          jq '{id,url,target,readyState,projectId,createdAt}' "$RUNNER_TEMP/deployment.json" > "$RUNNER_TEMP/deployment-evidence.json"

      - name: Validate deployed Preview in a real browser
        id: browser_validation
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          node scripts/p3-browser/validate.mjs \
            --base-url "$DEPLOYMENT_URL" \
            --manifest "$RUNNER_TEMP/site-package/site-package-manifest.json" \
            --report "$RUNNER_TEMP/browser-validation.json"

      - name: Write staging evidence record
        if: always() && steps.browser_validation.outcome == 'success' && steps.deployment_identity.outcome == 'success' && steps.deploy.outcome == 'success' && steps.package.outcome == 'success' && steps.source_run.outcome == 'success'
        env:
          SITE_PACKAGE_MANIFEST: ${{ runner.temp }}/site-package/site-package-manifest.json
          DEPLOYMENT_JSON: ${{ runner.temp }}/deployment-evidence.json
          BROWSER_REPORT: ${{ runner.temp }}/browser-validation.json
          STAGING_RECORD: ${{ runner.temp }}/staging-record.json
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_SHA: ${{ steps.source_run.outputs.source_run_sha }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.site_package_artifact_id }}
          PACKAGE_ARCHIVE_DIGEST: ${{ inputs.site_package_archive_digest }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: node scripts/p3-browser/create-staging-record.mjs

      - name: Upload staging and browser evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kirari-p3-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/staging-record.json
            ${{ runner.temp }}/browser-validation.json
            ${{ runner.temp }}/deployment-evidence.json
            ${{ runner.temp }}/site-package/site-package-manifest.json
          if-no-files-found: warn
          retention-days: 90

      - name: Add target and evidence links to summary
        if: always()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT_ID: ${{ steps.deployment_identity.outputs.deployment_id }}
          RECORD_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          {
            echo '## P3 nonproduction staging evidence'
            echo '- Target: Vercel project `kirari-test`, Preview'
            echo "- Deployment: [${DEPLOYMENT_ID:-not-created}](${DEPLOYMENT_URL:-})"
            echo "- Evidence artifact: ${RECORD_URL:-upload unavailable}"
            echo '- Production, DNS, indexing, release, and source writeback: none'
          } >> "$GITHUB_STEP_SUMMARY"
        id: summary
