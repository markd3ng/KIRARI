name: R3 trusted verifier publisher

on:
  workflow_run:
    workflows: [R3 trusted verifier]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  validate-source:
    # This unprivileged job verifies the authenticated run ID/attempt and its
    # workflow ID -> exact path mapping before the credential-bearing job exists.
    if: >
      github.event_name == 'workflow_run' &&
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'markd3ng/KIRARI' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      github.event.workflow_run.id > 0 &&
      github.event.workflow_run.run_attempt > 0
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      publisher_eligible: ${{ steps.validate.outputs.publisher_eligible }}
    env:
      R3_UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      R3_UPSTREAM_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}

    steps:
      - name: Check out publisher source from the workflow definition commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          check-latest: false

      - name: Download only the matching trusted verifier artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: r3-trusted-verifier-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/r3-trusted-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate upstream source and canonical evidence before requesting App credentials
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          R3_EVIDENCE_DIR: ${{ runner.temp }}/r3-trusted-evidence
        run: node scripts/root-audit/publisher-cli.mjs validate

  publish:
    needs: validate-source
    # The source API validation above must pass before this Environment-bearing job can start.
    if: >
      needs.validate-source.outputs.publisher_eligible == 'true' &&
      github.event_name == 'workflow_run' &&
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'markd3ng/KIRARI' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: r3-trusted-publisher
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    env:
      R3_UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      R3_UPSTREAM_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}

    steps:
      - name: Check out publisher source from the workflow definition commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          check-latest: false

      - name: Download only the matching trusted verifier artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: r3-trusted-verifier-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/r3-trusted-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Revalidate the source and evidence inside the gated job
        env:
          GH_TOKEN: ${{ github.token }}
          R3_EVIDENCE_DIR: ${{ runner.temp }}/r3-trusted-evidence
        run: node scripts/root-audit/publisher-cli.mjs validate

      - name: Mint a repository-scoped check-writer token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.KIRARI_R3_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.KIRARI_R3_PUBLISHER_PRIVATE_KEY }}
          owner: markd3ng
          repositories: KIRARI
          permission-checks: write
          skip-token-revoke: false

      - name: Publish the exact-head trusted App check
        env:
          GH_TOKEN: ${{ github.token }}
          R3_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          R3_PUBLISHER_APP_ID: ${{ vars.KIRARI_R3_PUBLISHER_APP_ID }}
          R3_EVIDENCE_DIR: ${{ runner.temp }}/r3-trusted-evidence
        run: node scripts/root-audit/publisher-cli.mjs publish
